name: ci

# The PR-level gate: runs the same bin/ci as a local run, so a secret committed past a
# bypassed hook, or a red tree, is caught before it merges.
#
# Hosted runner, on purpose. The repository is public, so Actions minutes are free, and
# a self-hosted runner would let a pull request from a fork run arbitrary code on that
# machine. Only pull requests trigger it: a push to main would re-test what its pull
# request already tested.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans the history the PR adds, so the checkout must carry it.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
      - run: bin/ci
