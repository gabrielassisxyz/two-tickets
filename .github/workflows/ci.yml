name: ci

# The PR-level gate: runs the same bin/ci as a local run, so a secret committed past a
# bypassed hook, or a red tree, is caught before it merges.
#
# Hosted runner for now. The repository is private, so these minutes come out of the
# account's monthly allowance; the plan moves CI to a self-hosted runner on the home
# server. Until then, a check that dies within seconds with "the job was not started"
# means the allowance ran out, not that the code is red. Only pull requests trigger it:
# a push to main would re-test what its PR already tested.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans the history the PR adds, so the checkout must carry it.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: bin/ci
