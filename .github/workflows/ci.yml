name: ci

# The PR-level gate: runs the same bin/ci as a local run, so a secret committed past a
# bypassed hook, or a red tree, is caught before it merges.
#
# Hosted runner, on purpose. The repository is public, so Actions minutes are free, and
# a self-hosted runner would let a pull request from a fork run arbitrary code on that
# machine. Only pull requests trigger it: a push to main would re-test what its pull
# request already tested.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans the history the PR adds, so the checkout must carry it.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # bin/ci switches on its Go section once go.mod exists. The toolchain comes
      # from go.mod's toolchain line, so govulncheck judges the standard library
      # the binary is actually built with.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint and govulncheck
        run: |
          version=2.12.2
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v${version}/golangci-lint-${version}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "golangci-lint-${version}-linux-amd64/golangci-lint"
          golangci-lint version
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck -version
      - run: bin/ci
